<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEUROSENSE AI Assistant</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
        body{background:#f4f8fb;min-height:100vh}
        .chat-button{position:fixed;right:25px;bottom:25px;width:65px;height:65px;border:0;border-radius:50%;background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff;font-size:28px;cursor:pointer;box-shadow:0 8px 25px rgba(0,114,255,.35);z-index:1000;transition:.3s;display:flex;align-items:center;justify-content:center}
        .chat-button:hover{transform:scale(1.08) rotate(5deg)}
        .chat-container{position:fixed;right:25px;bottom:105px;width:380px;max-width:calc(100vw - 30px);height:600px;max-height:calc(100vh - 130px);background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 15px 50px rgba(0,0,0,.2);display:none;flex-direction:column;z-index:999}
        .chat-container.active{display:flex;animation:openChat .25s ease}
        @keyframes openChat{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
        .chat-header{background:linear-gradient(135deg,#0066ff,#00b4db);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between}
        .header-left{display:flex;align-items:center;gap:12px}.bot-icon{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px}.bot-name{font-size:16px;font-weight:bold}.bot-status{font-size:11px;opacity:.9;display:flex;align-items:center;gap:5px;margin-top:2px}.status-dot{width:8px;height:8px;background:#2ed573;border-radius:50%}.header-actions{display:flex;gap:6px}.icon-button{border:0;background:rgba(255,255,255,.15);color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}.icon-button:hover{background:rgba(255,255,255,.3)}
        .chat-messages{flex:1;padding:16px;overflow-y:auto;background:#f7fafc;scroll-behavior:smooth}.message{display:flex;flex-direction:column;margin-bottom:14px;animation:fadeIn .2s ease-in}.message.bot{align-items:flex-start}.message.user{align-items:flex-end}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .message-content{max-width:85%;padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.5}.bot .message-content{background:#fff;color:#222;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.user .message-content{background:#0072ff;color:#fff;border-bottom-right-radius:4px}.message-reactions{display:flex;gap:6px;margin-top:4px;padding-left:4px}.reaction-btn{border:0;background:transparent;font-size:12px;cursor:pointer;opacity:.5}.reaction-btn:hover,.reaction-btn.selected{opacity:1;transform:scale(1.25)}
        .quick-questions{padding:10px 14px;background:#fff;border-top:1px solid #eee;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}.quick-button{white-space:nowrap;border:1px solid #d5e3f0;background:#f7fbff;color:#0066cc;padding:6px 12px;border-radius:16px;cursor:pointer;font-size:12px;flex-shrink:0}.quick-button:hover{background:#0066cc;color:#fff;border-color:#0066cc}
        .chat-input-area{display:flex;align-items:center;padding:12px;border-top:1px solid #eee;background:#fff}#userInput{flex:1;border:1px solid #e2e8f0;outline:0;background:#f8fafc;padding:10px 14px;border-radius:20px;font-size:14px}#userInput:focus{border-color:#0072ff;background:#fff}#sendButton{width:40px;height:40px;margin-left:8px;border:0;border-radius:50%;background:#0072ff;color:#fff;cursor:pointer;font-size:16px}#sendButton:hover{background:#005bb5;transform:scale(1.05)}
        .typing{display:flex;gap:4px;padding:4px}.typing span{width:6px;height:6px;background:#a0aec0;border-radius:50%;animation:typing 1.2s infinite ease-in-out}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}@keyframes typing{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
        @media(max-width:500px){.chat-container{right:0;bottom:0;width:100vw;height:100vh;max-width:100vw;max-height:100vh;border-radius:0}.chat-button{right:20px;bottom:20px}}
    </style>
</head>
<body>
    <button class="chat-button" id="chatButton" aria-label="Open NEUROSENSE Assistant">🧠</button>
    <div class="chat-container" id="chatContainer" role="dialog" aria-label="NEUROSENSE AI Assistant" aria-hidden="true">
        <div class="chat-header"><div class="header-left"><div class="bot-icon">🧠</div><div><div class="bot-name">NEUROSENSE Assistant</div><div class="bot-status"><span class="status-dot"></span> Online</div></div></div><div class="header-actions"><button class="icon-button" id="clearButton" title="Clear History" aria-label="Clear history">🗑️</button><button class="icon-button" id="closeButton" title="Close Chat" aria-label="Close chat">✕</button></div></div>
        <div class="chat-messages" id="chatMessages"></div><div class="quick-questions" id="quickQuestions"></div>
        <div class="chat-input-area"><input type="text" id="userInput" placeholder="Ask about NEUROSENSE..." autocomplete="off"><button id="sendButton" aria-label="Send Message">➤</button></div>
    </div>
    <script>
        const STORAGE_KEY='neurosense_chat_history';
        let chatHistory=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
        const defaultChips=['What is NEUROSENSE?','Sensors used','How does AI work?','Emergency alerts'];
        const $=id=>document.getElementById(id),chatButton=$('chatButton'),chatContainer=$('chatContainer'),closeButton=$('closeButton'),clearButton=$('clearButton'),sendButton=$('sendButton'),userInput=$('userInput'),chatMessages=$('chatMessages'),quickQuestions=$('quickQuestions');
        chatButton.addEventListener('click',toggleChat);closeButton.addEventListener('click',toggleChat);clearButton.addEventListener('click',clearHistory);sendButton.addEventListener('click',sendMessage);userInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&chatContainer.classList.contains('active'))toggleChat()});
        function toggleChat(){const active=chatContainer.classList.toggle('active');chatContainer.setAttribute('aria-hidden',String(!active));if(active){userInput.focus();chatMessages.scrollTop=chatMessages.scrollHeight}}
        function initChat(){renderChips(defaultChips);if(!chatHistory.length){chatHistory.push({text:'👋 Hello! I\'m the <b>NEUROSENSE AI Assistant</b>.<br><br>I can help you understand the NEUROSENSE wearable, its sensors, AI analysis, location tracking, and emergency alert system.<br><br>How can I help you today?',sender:'bot',id:Date.now()});saveHistory()}renderHistory()}
        function sendMessage(){const text=userInput.value.trim();if(!text)return;addMessage(text,'user');userInput.value='';showTyping();setTimeout(()=>{removeTyping();const response=generateResponse(text);addMessage(response.text,'bot');renderChips(response.nextChips||defaultChips)},600)}
        function addMessage(text,sender){const msg={text,sender,id:Date.now()};chatHistory.push(msg);saveHistory();renderSingleMessage(msg)}
        function renderSingleMessage(msg){const el=document.createElement('div');el.className='message '+msg.sender;const content=document.createElement('div');content.className='message-content';content.innerHTML=msg.text;el.appendChild(content);if(msg.sender==='bot'){const reactions=document.createElement('div');reactions.className='message-reactions';reactions.innerHTML='<button class="reaction-btn" aria-label="Helpful">👍</button><button class="reaction-btn" aria-label="Not helpful">👎</button>';reactions.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{reactions.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected')}));el.appendChild(reactions)}chatMessages.appendChild(el);chatMessages.scrollTop=chatMessages.scrollHeight}
        function renderChips(chips){quickQuestions.innerHTML='';chips.forEach(chip=>{const btn=document.createElement('button');btn.className='quick-button';btn.textContent=chip;btn.onclick=()=>{userInput.value=chip;sendMessage()};quickQuestions.appendChild(btn)})}
        function showTyping(){const el=document.createElement('div');el.className='message bot';el.id='typingIndicator';el.innerHTML='<div class="message-content"><div class="typing"><span></span><span></span><span></span></div></div>';chatMessages.appendChild(el);chatMessages.scrollTop=chatMessages.scrollHeight}function removeTyping(){const el=$('typingIndicator');if(el)el.remove()}function saveHistory(){localStorage.setItem(STORAGE_KEY,JSON.stringify(chatHistory))}function renderHistory(){chatMessages.innerHTML='';chatHistory.forEach(renderSingleMessage)}function clearHistory(){chatHistory=[];localStorage.removeItem(STORAGE_KEY);initChat()}
        function generateResponse(message){const text=message.toLowerCase();if(/hello|hi|hey/.test(text))return{text:'👋 Hello!<br><br>I\'m ready to answer questions about the NEUROSENSE wearable, its sensors, or tracking system.',nextChips:['What is NEUROSENSE?','Sensors used','How it works']};if(text.includes('what is neurosense')||text.includes('about neurosense')||text==='neurosense')return{text:'<b>NEUROSENSE</b> is an AI-based wearable monitoring and emergency alert system designed to support non-invasive tracking for autistic children.<br><br>It standardizes physiological metrics and identifies pattern shifts to assist caregivers preemptively.',nextChips:['Sensors used','How does AI work?','Emergency alerts']};if(text.includes('sensor')||text.includes('hardware'))return{text:'NEUROSENSE can leverage modular sensors:<br><br>❤️ Heart-rate sensor<br>🩸 SpO₂ pulse oximeter<br>🏃 Accelerometer<br>🔄 Gyroscope<br>🌡️ Temperature sensor<br>📍 GPS/location module',nextChips:['6-axis gyroscope','Heart rate tracking','GPS location']};if(text.includes('gyro')||text.includes('6 axis'))return{text:'A <b>6-axis motion sensor</b> combines a 3-axis accelerometer and a 3-axis gyroscope.<br><br>It helps NEUROSENSE analyze fine body movements, spatial orientation, and physical activity patterns.'};if(text.includes('ai')||text.includes('artificial intelligence')||text.includes('mental state'))return{text:'🧠 The AI component correlates baseline physiological signals over time using multi-sensor data.<br><br>By analyzing pattern shifts, it provides approximate state-change notifications to caregivers without direct medical intervention.',nextChips:['Emergency alerts','Data privacy','Sensors used']};if(text.includes('emergency')||text.includes('alert')||text.includes('danger'))return{text:'🚨 Alerts transmit real-time telemetry, location data, and relevant sensor signals directly to the caregiver application when predefined thresholds are met.',nextChips:['GPS location','NEUROSENSE app','Sensors used']};if(text.includes('location')||text.includes('gps')||text.includes('track'))return{text:'📍 The integrated GPS module tracks the device coordinates, enabling caregivers to view real-time position data through the companion mobile app.',nextChips:['NEUROSENSE app','Emergency alerts','Sensors used']};if(text.includes('app')||text.includes('application'))return{text:'📱 The companion app provides caregivers with a centralized dashboard displaying heart rate, movement trends, temperature readings, GPS location, and system alerts.',nextChips:['Data privacy','Emergency alerts','Sensors used']};if(text.includes('privacy')||text.includes('data')||text.includes('security'))return{text:'🔐 Encrypted transmission protocols safeguard incoming sensor telemetry, ensuring access is restricted to authorized caregivers.',nextChips:['NEUROSENSE app','Emergency alerts','Sensors used']};return{text:'🤔 I didn\'t quite catch that. Try selecting a suggested topic or ask about specific hardware details:',nextChips:defaultChips}}
        initChat();
    </script>
</body>
</html>
